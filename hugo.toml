# ==========================================
# 1. 基础与 SEO 配置
# ==========================================
# 网站上线前，记得把这里改成你的真实域名 (必须以 / 结尾)
baseURL = 'https://chinglish.cafe/' 

# 语言设置为美式英语，契合主要受众
locale = 'en-us'

# 包含核心关键词的网页标题，Google 搜索结果中显示的大字
title = 'Chinglish.Cafe | The Ultimate Dictionary of Chinese-English Slang & Translation Fails'

# 开启搜索引擎爬虫协议文件自动生成
enableRobotsTXT = true
disablehugogeneratorinject = true

# ==========================================
# 2. 路由与链接优化 (Permalinks)
# ==========================================
# 去掉 /posts/ 前缀，让所有词条 URL 保持极简 (如 /you-can-you-up/)
[permalinks]
  posts = "/:contentbasename/"
  page = "/:contentbasename/"
  series = "/:contentbasename/"
  categories = "/:contentbasename/"
  articles = "/:contentbasename/"

# ==========================================
# 3. 分类系统映射 (Taxonomies)
# ==========================================
# 必须在这里告诉 Hugo 把 category 识别为系统的分类系统。
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# ==========================================
# 4. 站点地图配置 (Sitemap - SEO 专用)
# ==========================================
# 告诉搜索引擎网站大约多久更新一次，以及抓取的优先级
[sitemap]
  changefreq = "weekly"
  priority = 0.8
  filename = "sitemap.xml"

# ==========================================
# 5. 社交媒体与全局参数 (Custom Params)
# ==========================================
[params]
  # 网站的全局描述 (Meta Description)，显示在 Google 搜索结果的描述栏
  description = "Explore the hilarious and fascinating world of Chinglish — and the surprising English born from China. Discover literal translations, internet slang, borrowed words, and the cultural stories behind them all."
  
  # 网站作者或运营者信息
  author = "Chinglish Cafe Team"
  
  # 默认的社交分享预览图 (匹配你 static/images/ 里的真实文件名)
  defaultSocialImage = "/images/default-cover.webp"

# ==========================================
# 6. 输出格式配置（Fuse.js 搜索索引与 RSS）
# ==========================================
[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true

# ==========================================
# 7. Front Matter 日期自动兜底策略
# ==========================================
# 优先读取 Markdown 的 date，若没有则抓取文件修改时间 (:fileModTime)
[frontmatter]
  date = ["date", "publishDate", "lastmod", ":fileModTime"]

# ==========================================
# 8. 第三方与系统服务配置 (Analytics & RSS)
# ==========================================
[services.googleAnalytics]
  ID = 'G-CVGWS33EFZ'   # GA4 衡量 ID

[services.rss]
  limit = 30            # RSS 订阅源限制输出最新的 30 条文章