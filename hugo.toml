# ==========================================
# 1. 基础与 SEO 配置
# ==========================================
# 网站上线前，记得把这里改成你的真实域名 (必须以 / 结尾)
baseURL = 'https://chinglish.cafe/' 

# 语言设置为美式英语，契合主要受众
languageCode = 'en-us' 

# 包含核心关键词的网页标题，Google 搜索结果中显示的大字
title = 'Chinglish.Cafe | The Ultimate Dictionary of Chinese-English Slang & Translation Fails'

# 首页分页数量，建议是 3 的倍数（因为我们用的是 is-one-third 三列网格布局）
[pagination]
  pagerSize = 18

# 🌟 新增：开启搜索引擎爬虫协议文件自动生成
enableRobotsTXT = true
disableHugoGeneratorInject = true

# ==========================================
# 2. 路由与链接优化 (Permalinks)
# ==========================================
# 去掉 /posts/ 前缀，让所有词条 URL 保持极简 (如 /you-can-you-up/)
[permalinks]
  posts = "/:slug/"
  page = "/:slug/" 
  series = "/:slug/"
  categories = "/:slug/"

# ==========================================
# 3. 分类系统映射 (Taxonomies)
# ==========================================
# 必须在这里告诉 Hugo 把 category 识别为系统的分类系统。
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# ==========================================
# 4. 站点地图配置 (Sitemap - SEO 专用)
# ==========================================
# 告诉搜索引擎网站大约多久更新一次，以及抓取的优先级
[sitemap]
  changefreq = "weekly"
  priority = 0.8
  filename = "sitemap.xml"

# ==========================================
# 5. 社交媒体与全局参数 (Custom Params)
# ==========================================
[params]
  # 网站的全局描述 (Meta Description)，显示在 Google 搜索结果的描述栏
  description = "Explore the hilarious and fascinating world of Chinglish — and the surprising English born from China. Discover literal translations, internet slang, borrowed words, and the cultural stories behind them all."
  
  # 网站作者或运营者信息
  author = "Chinglish Cafe Team"
  
  # 🌟 修正：默认的社交分享预览图 (匹配你 static/images/ 里的真实文件名)
  defaultSocialImage = "/images/default-cover.webp"
  