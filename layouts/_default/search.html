<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
  <style>
    .search-box {
      max-width: 640px;
      margin: 0 auto;
    }
    .search-input {
      border: 2px solid #5C4033;
      border-radius: 50px;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      width: 100%;
      transition: box-shadow 0.2s ease;
    }
    .search-input:focus {
      outline: none;
      box-shadow: 0 4px 15px rgba(92, 64, 51, 0.15);
    }
    .search-stats {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin: 1rem 0 2rem;
    }
    .search-result {
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      background: #fff;
      border: 1px solid #f0f0f0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .search-result:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      border-color: #e0d5cc;
    }
    .search-result-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #5C4033;
      margin-bottom: 0.4rem;
    }
    .search-result-title a {
      color: #5C4033;
      text-decoration: none;
    }
    .search-result-title a:hover {
      text-decoration: underline;
    }
    .search-result-meta {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 0.5rem;
    }
    .search-result-meaning {
      color: #444;
      line-height: 1.6;
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }
    .search-result-meaning strong {
      color: #666;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .search-highlight {
      background-color: rgba(222, 41, 16, 0.15);
      color: #9e1b0f;
      font-weight: 600;
      border-radius: 2px;
      padding: 0 2px;
    }
    .no-results {
      text-align: center;
      padding: 3rem;
      color: #888;
    }
    .no-results-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .search-tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background: #f5f0eb;
      color: #5C4033;
      margin-right: 0.4rem;
      font-weight: 600;
    }
    .match-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      background: #e8f5e9;
      color: #2e7d32;
      margin-left: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  {{ partial "navbar.html" . }}

  <main>
    <section class="hero is-small hero-pattern">
      <div class="hero-body has-text-centered py-6">
        <h1 class="title is-2 has-text-weight-bold color-coffee">
          🔍 Search Chinglish.Cafe
        </h1>
        <p class="subtitle is-5 has-text-grey mt-2">
          Find phrases, slang, and cultural stories.
        </p>
      </div>
    </section>

    <section class="section section-padding">
      <div class="container">
        <div class="search-box">
          <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="Type a phrase, meaning, or keyword..." 
            autocomplete="off"
          >
          <div class="search-stats" id="search-stats"></div>
        </div>
        <div id="search-results"></div>
      </div>
    </section>
  </main>

  {{ partial "footer.html" . }}

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  
  <script>
    (function() {
      const searchInput = document.getElementById('search-input');
      const resultsContainer = document.getElementById('search-results');
      const statsContainer = document.getElementById('search-stats');
      
      let fuse;
      let pages = [];

      fetch('/index.json')
        .then(res => res.json())
        .then(data => {
          pages = data;
          
          const options = {
            keys: [
              { name: 'chinglish_phrase', weight: 0.4 },
              { name: 'title', weight: 0.3 },
              { name: 'native_expression', weight: 0.2 },
              { name: 'chinese_meaning', weight: 0.1 }
            ],
            threshold: 0.25,
            includeScore: true,
            includeMatches: true,
            ignoreLocation: false,
            minMatchCharLength: 2
          };
          
          fuse = new Fuse(pages, options);
          
          const urlParams = new URLSearchParams(window.location.search);
          const query = urlParams.get('q');
          if (query) {
            searchInput.value = query;
            performSearch(query);
          }
        })
        .catch(err => {
          console.error('Failed to load search index:', err);
          resultsContainer.innerHTML = '<div class="no-results">⚠️ Failed to load search data. Please try again later.</div>';
        });

      let debounceTimer;
      searchInput.addEventListener('input', function(e) {
        clearTimeout(debounceTimer);
        const query = e.target.value.trim();
        
        debounceTimer = setTimeout(() => {
          if (query.length === 0) {
            resultsContainer.innerHTML = '';
            statsContainer.textContent = '';
            return;
          }
          performSearch(query);
        }, 150);
      });

      function highlightText(text, matches, keyName) {
        if (!text || !matches || matches.length === 0) {
          return escapeHtml(text || '');
        }
        const keyMatches = matches.filter(m => m.key === keyName);
        if (keyMatches.length === 0) {
          return escapeHtml(text);
        }
        let indices = [];
        keyMatches.forEach(m => {
          if (m.indices) indices = indices.concat(m.indices);
        });
        if (indices.length === 0) {
          return escapeHtml(text);
        }
        indices.sort((a, b) => a[0] - b[0]);
        const merged = [];
        for (const [start, end] of indices) {
          if (merged.length === 0 || start > merged[merged.length - 1][1] + 1) {
            merged.push([start, end]);
          } else {
            merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], end);
          }
        }
        let result = '';
        let lastEnd = 0;
        for (const [start, end] of merged) {
          result += escapeHtml(text.substring(lastEnd, start));
          result += '<mark class="search-highlight">' + escapeHtml(text.substring(start, end + 1)) + '</mark>';
          lastEnd = end + 1;
        }
        result += escapeHtml(text.substring(lastEnd));
        return result;
      }

      function getMatchLabel(matches) {
        if (!matches) return '';
        const keys = matches.map(m => m.key);
        if (keys.includes('chinglish_phrase')) return '<span class="match-badge">Phrase</span>';
        if (keys.includes('native_expression')) return '<span class="match-badge">Meaning</span>';
        if (keys.includes('chinese_meaning')) return '<span class="match-badge">Chinese</span>';
        return '';
      }

      function performSearch(query) {
        if (!fuse) return;
        
        const results = fuse.search(query);
        
        if (results.length > 0) {
          statsContainer.textContent = results.length + ' result' + (results.length > 1 ? 's' : '') + ' for "' + query + '"';
        } else {
          statsContainer.textContent = '';
        }
        
        if (results.length === 0) {
          resultsContainer.innerHTML = 
            '<div class="no-results">' +
              '<div class="no-results-icon">😕</div>' +
              '<p class="is-size-5">No results found for "<strong>' + escapeHtml(query) + '</strong>"</p>' +
              '<p class="mt-2">Try searching with different keywords or check your spelling.</p>' +
            '</div>';
          return;
        }

        const html = results.map(result => {
          const page = result.item;
          const matches = result.matches || [];

          const hlPhrase = highlightText(page.chinglish_phrase || '', matches, 'chinglish_phrase');
          const hlTitle = highlightText(page.title || '', matches, 'title');
          const hlNative = highlightText(page.native_expression || '', matches, 'native_expression');
          const hlChinese = highlightText(page.chinese_meaning || '', matches, 'chinese_meaning');

          const displayTitle = page.chinglish_phrase 
            ? (hlPhrase || escapeHtml(page.chinglish_phrase))
            : hlTitle;

          let subtitle = '';
          if (page.chinglish_phrase && page.chinglish_phrase !== page.title) {
            subtitle = '<div style="font-size:0.9rem; color:#666; margin-top:0.2rem;">' + hlTitle + '</div>';
          }

          let meaningLines = '';
          if (page.chinese_meaning) {
            meaningLines += '<div class="search-result-meaning"><strong>🇨🇳 </strong>' + (hlChinese || escapeHtml(page.chinese_meaning)) + '</div>';
          }
          if (page.native_expression) {
            meaningLines += '<div class="search-result-meaning"><strong>🇺🇸 </strong>' + (hlNative || escapeHtml(page.native_expression)) + '</div>';
          }

          const categoryHtml = page.category
            ? '<span class="search-tag" style="background:#DE2910; color:#fff;">' + escapeHtml(Array.isArray(page.category) ? page.category[0] : page.category) + '</span>'
            : '';

          const matchLabel = getMatchLabel(matches);

          return '<div class="search-result">' +
              '<div class="search-result-title">' +
                '<a href="' + escapeHtml(page.permalink) + '">' + displayTitle + '</a>' +
                matchLabel +
              '</div>' +
              subtitle +
              '<div class="search-result-meta">' + categoryHtml + '</div>' +
              meaningLines +
            '</div>';
        }).join('');

        resultsContainer.innerHTML = html;
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
    })();
  </script>
</body>
</html>
