<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 引入全站头部 -->
    {{ partial "head.html" . }}
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar is-transparent py-2" style="border-bottom: 1px solid #f0f0f0;">
    <div class="container">
        <div class="navbar-brand">
            <a class="navbar-item is-size-4 has-text-weight-bold" href="/">
                <span class="color-cn-red">Ch</span><span class="color-coffee inglish-style">inglish</span>
                <img src="/images/papercut.png" alt="Chinglish Cafe Emblem" class="logo-icon-dot-nav">
                <span class="color-coffee">Cafe</span>
            </a>
        </div>
        <div class="navbar-menu is-active" style="box-shadow: none;">
            <div class="navbar-end">
                <!-- 返回首页 -->
                <a href="/" class="navbar-item has-text-grey has-text-weight-semibold">
                    &larr; Home
                </a>
                <!-- 🌟 新增：画廊入口 -->
                <a href="/gallery/" class="navbar-item has-text-grey has-text-weight-semibold">
                    📸 Gallery
                </a>
                <!-- 🌟 新增：English from China 入口 -->
                <a href="/english-from-china/" class="navbar-item has-text-grey has-text-weight-semibold">
                    📜 English from China
                </a>
            </div>
        </div>
    </div>
</nav>

    <!-- 通用单页内容区 (居中，无侧边栏) -->
    <section class="section section-padding" style="min-height: 70vh;">
        <!-- 设定 max-width 为 800px，这是最适合长文本阅读的宽度 -->
        <div class="container" style="max-width: 800px;"> 
            <h1 class="title is-2 has-text-centered has-text-dark mb-6">{{ .Title }}</h1>
            
            <!-- Bulma 的 content 类会自动排版 Markdown 生成的段落、列表和加粗 -->
            <div class="content is-medium has-text-grey-dark" style="line-height: 1.8;">
                {{ .Content }}
            </div>
        </div>
    </section>

    <!-- 引入全站底部 -->
    {{ partial "footer.html" . }}
</body>
</html>
