<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 引入全站头部 -->
    {{ partial "head.html" . }}
</head>
<body>
{{ partial "navbar.html" . }}
    {{ partial "breadcrumb.html" . }}

    <!-- 通用单页内容区 (居中，无侧边栏) -->
    <section class="section section-padding" style="min-height: 70vh;">
        <!-- 设定 max-width 为 800px，这是最适合长文本阅读的宽度 -->
        <div class="container"> 
            <h1 class="title is-2 has-text-centered has-text-dark mb-6">{{ .Title }}</h1>
            
            <!-- Bulma 的 content 类会自动排版 Markdown 生成的段落、列表和加粗 -->
            <div class="content is-medium has-text-grey-dark" style="line-height: 1.8;">
                {{ .Content }}
            </div>
        </div>
    </section>

    <!-- 引入全站底部 -->
    {{ partial "footer.html" . }}
</body>
</html>
